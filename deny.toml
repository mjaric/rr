[advisories]
yanked = "deny"

[licenses]
# Allowlist covers common permissive licenses; not all appear in the small
# current dep tree, so don't warn about unmatched allowances.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
# Our own crates are proprietary and unpublished (publish = false)
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
