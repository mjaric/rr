[advisories]
yanked = "deny"
ignore = [
    # paste (unmaintained): compile-time proc-macro pulled transitively by
    # parquet 59; no fixed alternative exists; re-evaluate when parquet drops it.
    "RUSTSEC-2024-0436",
]

[licenses]
# Allowlist covers common permissive licenses; not all appear in the small
# current dep tree, so don't warn about unmatched allowances.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # Arrived transitively with M1 deps (sqlx/parquet/barter-data); reviewed 2026-06-12.
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
# Our own crates are proprietary and unpublished (publish = false)
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path deps are private (publish = false) and carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
