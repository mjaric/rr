[project]
name = "rr-analytics"
version = "0.1.0"
description = "Advisory analytics for the rr trading agent"
readme = "README.md"
authors = [
    { name = "Milan Jaric", email = "327155+mjaric@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.15.17", "ty==0.0.49"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
